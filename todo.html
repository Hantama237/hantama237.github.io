<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Todo App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: tailwind.colors.indigo,
            secondary: tailwind.colors.slate,
            priority: {
              high: tailwind.colors.red[500],
              medium: tailwind.colors.amber[500],
              low: tailwind.colors.green[500],
            }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .task-description-area {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding-bottom 0.3s ease-out, margin-top 0.3s ease-out;
    }
    .task-description-area.expanded {
      max-height: 500px;
    }
  </style>
</head>
<body class="bg-secondary-100 min-h-screen font-sans flex flex-col">

  <header class="bg-primary-600 text-white shadow-md sticky top-0 z-20">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold">My Tasks</h1>
      <div>
        <span id="todoCount" class="bg-primary-500 text-xs font-semibold px-2 py-1 rounded-full">0</span>
        <span class="ml-1 text-sm">tasks</span>
      </div>
    </div>
  </header>

  <main class="container mx-auto p-4 flex-grow">
    <ul id="todoList" class="space-y-3">
    </ul>
  </main>

  <button id="openModalButton" title="Add New Task"
          class="fixed bottom-6 right-6 bg-primary-600 hover:bg-primary-700 text-white rounded-full p-4 shadow-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-transform hover:scale-110 z-20">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
    </svg>
  </button>

  <div id="taskModal" class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm flex items-center justify-center p-4 z-30 hidden">
    <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md transform transition-all">
      <div class="flex justify-between items-center mb-6">
        <h2 id="modalTitle" class="text-xl font-semibold text-secondary-800">Add New Task</h2>
        <button id="closeModalButton" class="text-secondary-400 hover:text-secondary-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form id="taskForm" class="space-y-4">
        <div>
          <label for="todoInput" class="block text-sm font-medium text-secondary-700 mb-1">Task Title</label>
          <input id="todoInput" type="text" placeholder="e.g., Buy groceries"
                 class="w-full p-3 border border-secondary-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent" required>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="prioritySelect" class="block text-sm font-medium text-secondary-700 mb-1">Priority</label>
            <select id="prioritySelect" class="w-full p-3 border border-secondary-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div>
            <label for="estimateSelect" class="block text-sm font-medium text-secondary-700 mb-1">Est. Time</label>
            <select id="estimateSelect" class="w-full p-3 border border-secondary-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent">
              <option value="15">15 min</option>
              <option value="30" selected>30 min</option>
              <option value="60">1 hour</option>
              <option value="120">2 hours</option>
              <option value="240">4 hours</option>
            </select>
          </div>
        </div>
        <div>
          <label for="dueDate" class="block text-sm font-medium text-secondary-700 mb-1">Due Date (Optional)</label>
          <input id="dueDate" type="date" class="w-full p-3 border border-secondary-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent">
        </div>
        <input type="hidden" id="editingTaskID">
        <div class="flex justify-end space-x-3 pt-2">
            <button type="button" id="cancelButton" class="px-4 py-2 text-sm font-medium text-secondary-700 bg-secondary-100 hover:bg-secondary-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary-400">Cancel</button>
            <button type="submit" id="saveTaskButton" class="px-4 py-2 text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const taskModal = document.getElementById('taskModal');
      const openModalButton = document.getElementById('openModalButton');
      const closeModalButton = document.getElementById('closeModalButton');
      const cancelButton = document.getElementById('cancelButton');
      const taskForm = document.getElementById('taskForm');
      const modalTitle = document.getElementById('modalTitle');
      const saveTaskButton = document.getElementById('saveTaskButton');
      
      const todoInput = document.getElementById('todoInput');
      const prioritySelect = document.getElementById('prioritySelect');
      const estimateSelect = document.getElementById('estimateSelect');
      const dueDate = document.getElementById('dueDate');
      const editingTaskIDInput = document.getElementById('editingTaskID');

      const todoList = document.getElementById('todoList');
      const todoCount = document.getElementById('todoCount');

      let todos = JSON.parse(localStorage.getItem('todos')) || [];

      function openTaskModal(taskID = null) {
        taskForm.reset();
        dueDate.valueAsDate = new Date();
        const taskToEdit = taskID ? todos.find(t => t.id === taskID) : null;
        if (taskToEdit) {
          modalTitle.textContent = 'Edit Task';
          saveTaskButton.textContent = 'Update Task';
          todoInput.value = taskToEdit.text;
          prioritySelect.value = taskToEdit.priority;
          estimateSelect.value = taskToEdit.estimate;
          dueDate.value = taskToEdit.dueDate;
          editingTaskIDInput.value = taskToEdit.id;
        } else {
          modalTitle.textContent = 'Add New Task';
          saveTaskButton.textContent = 'Save Task';
          editingTaskIDInput.value = '';
        }
        taskModal.classList.remove('hidden');
        todoInput.focus();
      }

      function closeTaskModal() {
        taskModal.classList.add('hidden');
      }

      openModalButton.addEventListener('click', () => openTaskModal());
      closeModalButton.addEventListener('click', closeTaskModal);
      cancelButton.addEventListener('click', closeTaskModal);
      taskModal.addEventListener('click', (e) => { if (e.target === taskModal) closeTaskModal(); });
      document.addEventListener('keydown', (e) => { if (e.key === "Escape" && !taskModal.classList.contains('hidden')) closeTaskModal(); });

      function updateCount() {
        todoCount.textContent = todos.filter(todo => !todo.completed).length;
      }

      function formatDate(dateString) {
        if (!dateString) return '';
        const options = { year: 'numeric', month: 'short', day: 'numeric' };
        return new Date(dateString + 'T00:00:00').toLocaleDateString('en-US', options);
      }
      
      function getPrioritySideBarColor(priority) {
        switch (priority) {
          case 'high': return 'bg-priority-high';
          case 'medium': return 'bg-priority-medium';
          case 'low': return 'bg-priority-low';
          default: return 'bg-secondary-300';
        }
      }
      function getPriorityBadgeClasses(priority) {
        switch (priority) {
          case 'high': return 'bg-red-100 text-red-700';
          case 'medium': return 'bg-amber-100 text-amber-700';
          case 'low': return 'bg-green-100 text-green-700';
          default: return 'bg-secondary-100 text-secondary-700';
        }
      }

      function renderTodos() {
        todoList.innerHTML = '';
        if (todos.length === 0) {
          todoList.innerHTML = `<p id="emptyState" class="text-center text-secondary-500 py-10 text-lg">🎉 You're all caught up! Add a new task.</p>`;
          updateCount();
          return;
        }

        const sortedTodos = [...todos].sort((a, b) => {
            if (a.completed !== b.completed) return a.completed ? 1 : -1;
            if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
            if (a.dueDate) return -1;
            if (b.dueDate) return 1;
            return 0;
        });

        sortedTodos.forEach(todo => {
          const li = document.createElement('li');
          li.className = `bg-white shadow-md rounded-lg overflow-hidden group relative transition-all duration-300 ease-in-out ${todo.completed ? 'opacity-60' : ''}`;
          li.dataset.id = todo.id;
          const prioritySideBarClass = getPrioritySideBarColor(todo.priority);
          
          li.innerHTML = `
            <div class="absolute left-0 top-0 bottom-0 w-1.5 ${prioritySideBarClass}"></div>
            <div class="pl-6 pr-4 py-4">
              <div class="flex items-start">
                <div class="flex-shrink-0 pt-0.5">
                  <input type="checkbox" id="complete-${todo.id}" ${todo.completed ? 'checked' : ''}
                         data-id="${todo.id}"
                         class="h-5 w-5 rounded border-secondary-300 text-primary-600 focus:ring-primary-500 cursor-pointer toggle-complete">
                </div>
                <div class="ml-4 flex-grow min-w-0">
                  <div class="flex justify-between items-start">
                    <div class="task-title-clickable flex-grow mr-2 cursor-pointer" data-id="${todo.id}">
                      <p class="text-secondary-800 font-medium text-base ${todo.completed ? 'line-through text-secondary-500' : ''} flex justify-between items-center">
                        <span class="break-words">${todo.text}</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-secondary-400 description-chevron flex-shrink-0 ml-2 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                      </p>
                    </div>
                    <div class="flex-shrink-0 flex items-center space-x-0.5">
                      <button title="Edit Task" data-id="${todo.id}" class="p-1.5 text-secondary-400 hover:text-primary-600 focus:outline-none edit-task">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>
                      </button>
                      <button title="Delete Task" data-id="${todo.id}" class="p-1.5 text-secondary-400 hover:text-red-600 focus:outline-none delete-task">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                      </button>
                    </div>
                  </div>
                  <div class="mt-1.5 text-xs text-secondary-500 flex flex-wrap items-center gap-x-3 gap-y-1">
                    <span class="${getPriorityBadgeClasses(todo.priority)} px-1.5 py-0.5 rounded-full font-medium text-[0.7rem]">
                      ${todo.priority.charAt(0).toUpperCase() + todo.priority.slice(1)}
                    </span>
                    <span class="flex items-center">
                      <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 mr-1 text-secondary-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                      ${todo.estimate} min
                    </span>
                    ${todo.dueDate ? `
                      <span class="flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 mr-1 text-secondary-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        ${formatDate(todo.dueDate)}
                      </span>` : ''}
                  </div>
                </div>
              </div>
              <div class="task-description-area pl-[calc(0.5rem+1.25rem)] pr-0 pt-0">
                <div class="border-t border-secondary-200 mt-3 pt-3">
                  <label for="taskDescriptionInput-${todo.id}" class="block text-xs font-medium text-secondary-600 mb-1">Notes / Breakdown:</label>
                  <textarea id="taskDescriptionInput-${todo.id}" rows="3" data-id="${todo.id}"
                            class="w-full p-2 border border-secondary-300 rounded-md focus:ring-primary-500 focus:border-primary-500 text-sm bg-secondary-50 resize-y"
                            placeholder="Add details...">${todo.description || ''}</textarea>
                  <div class="mt-2 text-right">
                    <button type="button" data-id="${todo.id}"
                            class="save-description-button px-3 py-1.5 text-xs font-medium text-white bg-primary-500 hover:bg-primary-600 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-1">
                      Save Notes
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;
          todoList.appendChild(li);
        });
        addEventListenersToTasks();
        updateCount();
      }

      function addEventListenersToTasks() {
        document.querySelectorAll('.toggle-complete').forEach(cb => cb.addEventListener('change', (e) => toggleComplete(e.target.dataset.id)));
        document.querySelectorAll('.edit-task').forEach(btn => btn.addEventListener('click', (e) => openTaskModal(e.currentTarget.dataset.id)));
        document.querySelectorAll('.delete-task').forEach(btn => btn.addEventListener('click', (e) => deleteTodo(e.currentTarget.dataset.id)));
        document.querySelectorAll('.task-title-clickable').forEach(el => el.addEventListener('click', (e) => toggleDescription(e.currentTarget.dataset.id)));
        document.querySelectorAll('.save-description-button').forEach(btn => btn.addEventListener('click', (e) => saveDescription(e.currentTarget.dataset.id)));
      }
      
      taskForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = todoInput.value.trim();
        const priority = prioritySelect.value;
        const estimate = estimateSelect.value;
        const due = dueDate.value;
        const taskID = editingTaskIDInput.value;

        if (text) {
          if (taskID) { // Editing existing task
            const taskIndex = findTaskIndexById(taskID);
            if (taskIndex > -1) {
              todos[taskIndex] = {
                ...todos[taskIndex], // Spread existing properties like id, completed
                text: text,
                priority: priority,
                estimate: estimate,
                dueDate: due,
                description: todos[taskIndex].description || '' // Preserve existing or init if missing
              };
            }
          } else { // Adding new task
            todos.push({
              id: String(Date.now()),
              text: text,
              priority: priority,
              estimate: estimate,
              dueDate: due,
              completed: false,
              description: '' // Initialize description for new tasks
            });
          }
          
          localStorage.setItem('todos', JSON.stringify(todos));
          renderTodos();
          closeTaskModal();
        }
      });

      function findTaskIndexById(id) { return todos.findIndex(todo => todo.id === id); }

      function deleteTodo(taskID) {
        const taskIndex = findTaskIndexById(taskID);
        if (taskIndex > -1) {
          todos.splice(taskIndex, 1);
          localStorage.setItem('todos', JSON.stringify(todos));
          renderTodos();
        }
      }

      function toggleComplete(taskID) {
        const taskIndex = findTaskIndexById(taskID);
        if (taskIndex > -1) {
          todos[taskIndex].completed = !todos[taskIndex].completed;
          localStorage.setItem('todos', JSON.stringify(todos));
          renderTodos();
        }
      }

      function toggleDescription(taskID) {
        const taskElement = document.querySelector(`li[data-id="${taskID}"]`);
        if (taskElement) {
          const descriptionArea = taskElement.querySelector('.task-description-area');
          const chevron = taskElement.querySelector('.description-chevron');
          if (descriptionArea.classList.contains('expanded')) {
            descriptionArea.classList.remove('expanded');
            descriptionArea.style.paddingBottom = '0';
            descriptionArea.style.marginTop = '0';
            chevron.classList.remove('rotate-180');
          } else {
            descriptionArea.classList.add('expanded');
            descriptionArea.style.paddingBottom = '1rem';
            descriptionArea.style.marginTop = '0.75rem';
            chevron.classList.add('rotate-180');
          }
        }
      }

      function saveDescription(taskID) {
        const taskIndex = findTaskIndexById(taskID);
        if (taskIndex > -1) {
          const textarea = document.getElementById(`taskDescriptionInput-${taskID}`);
          todos[taskIndex].description = textarea.value.trim();
          localStorage.setItem('todos', JSON.stringify(todos));
          // Small user feedback (can be improved with a temporary toast message)
          const saveButton = textarea.closest('.task-description-area').querySelector('.save-description-button');
          const originalText = saveButton.textContent;
          saveButton.textContent = 'Saved!';
          saveButton.classList.add('bg-green-500', 'hover:bg-green-600');
          saveButton.classList.remove('bg-primary-500', 'hover:bg-primary-600');
          setTimeout(() => {
            saveButton.textContent = originalText;
            saveButton.classList.remove('bg-green-500', 'hover:bg-green-600');
            saveButton.classList.add('bg-primary-500', 'hover:bg-primary-600');
          }, 1500);
        }
      }

      if (!dueDate.value) dueDate.valueAsDate = new Date();
      renderTodos();
    });
  </script>
</body>
</html>
