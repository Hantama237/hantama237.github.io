<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nokia Snake Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --nokia-bg: #e5e5c7;
      --nokia-dark: #bfc2a7;
      --nokia-border: #6d6d5e;
      --nokia-black: #22281c;
      --nokia-white: #f8f8e7;
    }
    html, body {
      font-family: 'Share Tech Mono', monospace;
      background: var(--nokia-bg);
      color: var(--nokia-black);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    h1 {
      margin-top: 1.5rem;
      font-size: 2rem;
      text-align: center;
      color: var(--nokia-black);
      text-shadow: 1px 1px 0 var(--nokia-border);
    }
    .nokia-border {
      border: 3px solid var(--nokia-border);
      border-radius: 0.75rem;
      background: var(--nokia-white);
      box-shadow: 0 0 0 3px var(--nokia-dark);
    }
    #game-container {
      margin: 2rem auto 1rem auto;
      width: 90vw;
      max-width: 400px;
      aspect-ratio: 1/1;
      background: var(--nokia-white);
      position: relative;
      touch-action: none;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      background: var(--nokia-bg);
      border: 2px solid var(--nokia-border);
      border-radius: 0.5rem;
      box-shadow: 0 2px 0 var(--nokia-dark);
    }
    .score {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      text-align: center;
      color: var(--nokia-black);
    }
    .nokia-btn {
      background: var(--nokia-dark);
      color: var(--nokia-black);
      border: 2px solid var(--nokia-border);
      font-family: 'Share Tech Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 2px 0 var(--nokia-border);
      transition: background 0.2s, color 0.2s;
      font-size: 1rem;
      padding: 0.5rem 1.2rem;
      border-radius: 0.4rem;
      margin: 0.5rem auto;
      display: block;
    }
    .nokia-btn:active {
      background: var(--nokia-border);
      color: var(--nokia-white);
    }
    @media (max-width: 500px) {
      #game-container { max-width: 98vw; }
      h1 { font-size: 1.2rem; }
      .score { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <h1>Nokia Snake</h1>
  <div class="score" id="score">Score: 0</div>
  <form id="name-form" style="text-align:center;margin-bottom:0.5rem;">
    <input id="player-name" type="text" maxlength="20" placeholder="Enter your name" required style="font-family:'Share Tech Mono',monospace;font-size:1rem;padding:0.3rem 0.7rem;border:2px solid var(--nokia-border);border-radius:0.4rem;background:var(--nokia-white);color:var(--nokia-black);margin-bottom:0.3rem;">
    <button class="nokia-btn" type="submit" style="display:inline-block;">Set Name</button>
  </form>
  <div id="top-score" style="text-align:center;font-size:1rem;color:var(--nokia-border);margin-bottom:0.5rem;"></div>
  <div id="leaderboard" class="nokia-border" style="max-width:400px;margin:0 auto 1rem auto;padding:0.5rem 1rem 1rem 1rem;background:var(--nokia-white);">
    <div style="font-weight:bold;text-align:center;margin-bottom:0.3rem;color:var(--nokia-black);font-size:1.1rem;">Leaderboard</div>
    <ol id="leaderboard-list" style="list-style:decimal inside;font-size:0.98rem;padding:0;margin:0;color:var(--nokia-black);"></ol>
  </div>
  <div style="text-align:center;font-size:0.95rem;margin-bottom:0.5rem;color:var(--nokia-border);">
    Swipe or tap on the canvas to control the snake.<br>
    Tap top/bottom/left/right to turn, or swipe in a direction.<br>
    Use arrow keys on desktop.
  </div>
  <div id="game-container" class="nokia-border">
    <canvas id="game" width="300" height="300"></canvas>
  </div>
  <button class="nokia-btn" id="restart">Restart</button>
  <script>
    // --- Game constants ---
    const CELL_SIZE = 15;
    const GRID_SIZE = 20;
    const CANVAS_SIZE = CELL_SIZE * GRID_SIZE;
    const SNAKE_COLOR = '#22281c';
    const FOOD_COLOR = '#bfc2a7';
    const BG_COLOR = '#e5e5c7';
    let snake, food, dir, nextDir, score, gameOver, intervalId;

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const restartBtn = document.getElementById('restart');

    function resetGame() {
      snake = [{x: 10, y: 10}];
      dir = {x: 1, y: 0};
      nextDir = dir;
      food = randomFood();
      score = 0;
      gameOver = false;
      scoreEl.textContent = 'Score: 0';
      clearInterval(intervalId);
      intervalId = setInterval(gameLoop, 140); // slower speed
    }

    function randomFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * GRID_SIZE),
          y: Math.floor(Math.random() * GRID_SIZE)
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      return pos;
    }

    function gameLoop() {
      // Move
      dir = nextDir;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
      // Check collision
      if (
        head.x < 0 || head.x >= GRID_SIZE ||
        head.y < 0 || head.y >= GRID_SIZE ||
        snake.some(s => s.x === head.x && s.y === head.y)
      ) {
        gameOver = true;
        clearInterval(intervalId);
        scoreEl.textContent = 'Game Over! Score: ' + score;
        storeScoreIfTop();
        return;
      }
      snake.unshift(head);
      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = 'Score: ' + score;
        food = randomFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = BG_COLOR;
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      // Draw food
      ctx.fillStyle = FOOD_COLOR;
      ctx.fillRect(food.x * CELL_SIZE, food.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      // Draw snake
      ctx.fillStyle = SNAKE_COLOR;
      snake.forEach((s, i) => {
        ctx.fillRect(s.x * CELL_SIZE, s.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      });
    }

    // Keyboard controls
    document.addEventListener('keydown', e => {
      if (gameOver) return;
      if (e.key === 'ArrowUp' && dir.y !== 1) nextDir = {x: 0, y: -1};
      else if (e.key === 'ArrowDown' && dir.y !== -1) nextDir = {x: 0, y: 1};
      else if (e.key === 'ArrowLeft' && dir.x !== 1) nextDir = {x: -1, y: 0};
      else if (e.key === 'ArrowRight' && dir.x !== -1) nextDir = {x: 1, y: 0};
    });

    // Touch controls (swipe)
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    });
    canvas.addEventListener('touchend', e => {
      if (gameOver) return;
      if (e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 20 && dir.x !== -1) nextDir = {x: 1, y: 0};
          else if (dx < -20 && dir.x !== 1) nextDir = {x: -1, y: 0};
        } else {
          if (dy > 20 && dir.y !== -1) nextDir = {x: 0, y: 1};
          else if (dy < -20 && dir.y !== 1) nextDir = {x: 0, y: -1};
        }
      }
    });
    // Tap controls (tap left/right/top/bottom of canvas)
    canvas.addEventListener('click', e => {
      if (gameOver) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (y < rect.height * 0.3 && dir.y !== 1) nextDir = {x: 0, y: -1};
      else if (y > rect.height * 0.7 && dir.y !== -1) nextDir = {x: 0, y: 1};
      else if (x < rect.width * 0.3 && dir.x !== 1) nextDir = {x: -1, y: 0};
      else if (x > rect.width * 0.7 && dir.x !== -1) nextDir = {x: 1, y: 0};
    });

    restartBtn.addEventListener('click', resetGame);
    window.addEventListener('resize', () => {
      // Resize canvas to fit container
      const container = document.getElementById('game-container');
      const size = Math.min(container.offsetWidth, container.offsetHeight);
      canvas.width = canvas.height = CANVAS_SIZE;
      draw();
    });
    resetGame();

    // --- Name and score handling ---
    let playerName = localStorage.getItem('snake_player_name') || '';
    let topScore = 0;
    let topScoreName = '';
    const nameForm = document.getElementById('name-form');
    const nameInput = document.getElementById('player-name');
    const topScoreDiv = document.getElementById('top-score');
    if (playerName) nameInput.value = playerName;

    nameForm.addEventListener('submit', function(e) {
      e.preventDefault();
      playerName = nameInput.value.trim().slice(0, 20);
      localStorage.setItem('snake_player_name', playerName);
      nameInput.blur();
      nameForm.querySelector('button').textContent = 'Name Set';
      setTimeout(()=>{nameForm.querySelector('button').textContent='Set Name';}, 1200);
      fetchLeaderboard();
    });

    // Fetch top score from SheetDB
    async function fetchTopScore() {
      try {
        const res = await fetch('https://api.sheetbest.com/sheets/47569c1f-dda0-424c-a862-80500bb064a0?_sort=score&_order=desc&_limit=1');
        const data = await res.json();
        if (data && data[0]) {
          topScore = parseInt(data[0].score, 10) || 0;
          topScoreName = data[0].name || '';
          topScoreDiv.textContent = `Top Score: ${topScore} by ${topScoreName}`;
        } else {
          topScoreDiv.textContent = 'No top score yet.';
        }
      } catch (e) {
        topScoreDiv.textContent = 'Top score unavailable.';
      }
    }
    fetchTopScore();

    // Fetch leaderboard from SheetDB
    async function fetchLeaderboard() {
      try {
        const res = await fetch('https://api.sheetbest.com/sheets/47569c1f-dda0-424c-a862-80500bb064a0');
        let data = await res.json();
        // Sort descending by score (as number)
        data = data.filter(row => row.score && !isNaN(row.score)).sort((a, b) => parseInt(b.score, 10) - parseInt(a.score, 10));
        data = data.slice(0, 10);
        const list = document.getElementById('leaderboard-list');
        list.innerHTML = '';
        if (data && data.length) {
          data.forEach((row, i) => {
            const li = document.createElement('li');
            li.textContent = `${row.name || 'Anonymous'} — ${row.score}`;
            if (playerName && row.name === playerName) {
              li.style.fontWeight = 'bold';
              li.style.color = 'var(--nokia-border)';
            }
            list.appendChild(li);
          });
        } else {
          list.innerHTML = '<li>No scores yet.</li>';
        }
      } catch (e) {
        document.getElementById('leaderboard-list').innerHTML = '<li>Leaderboard unavailable.</li>';
      }
    }
    fetchLeaderboard();

    // Store score to SheetDB if it's a new top score
    async function storeScoreIfTop() {
      if (!playerName) return;
      if (score > topScore) {
        // Store to SheetDB
        try {
          await fetch('https://api.sheetbest.com/sheets/47569c1f-dda0-424c-a862-80500bb064a0', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-API-KEY': 'cDDsLeU9%lyEJOvPkb1ymy9@jwqKtl0k0ksQ5@mBO68KsSUtnH5Pi93W!RE9auAR'
            },
            body: JSON.stringify({ name: playerName, score: score })
          });
          fetchTopScore();
          fetchLeaderboard();
        } catch (e) {
          // ignore
        }
      }
    }
  </script>
</body>
</html>
